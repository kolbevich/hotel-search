workflows:
  # This is a dummy test workflow for iOS with reporting
    dummy_test-ios-workflow:
        name: Dummy test iOS workflow with Allure
        max_build_duration: 120
        instance_type: mac_mini_m2
        environment:
          groups:
            - serpapi_credentials
          flutter: 3.29.2
          xcode: 16.2 
          cocoapods: default
        cache:
          cache_paths:
            - $HOME/.pub-cache
            - $HOME/Library/Caches/CocoaPods
        scripts:
        - name: Install and setup allure-xcresult
          script: |
            git clone https://$GH_USERNAME:$GH_TOKEN@github.com/kvld/allure-xcresult.git
            cd allure-xcresult 
            swift package init --type executable
            swift build
            swift run AllureXCResult --version
        - name: Install Allure
          script: |
            brew install allure
            allure --version
        - name: Get Flutter packages
          script: | 
              flutter pub get
        - name: Generate .env file
          script: |
            echo "SERPAPI_API_KEY=$SERPAPI_API_KEY" > .env
        - name: Run code generation
          script: dart run build_runner build --delete-conflicting-outputs
        - name: Install pods
          script: | 
              find . -name "Podfile" -execdir pod install \;
        - name: Activate Patrol CLI
          script: | 
              dart pub global activate patrol_cli   
        - name: Run simulator
          script: | 
              xcrun simctl boot $( xcrun simctl list devices | grep -m 1 'iPhone 15 Pro' | grep -E -o -i '([0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12})')
              open -a /Applications/Xcode.app/Contents/Developer/Applications/Simulator.app
        - name: Run patrol tests
          script: |
              patrol test --target integration_test/dummy_test.dart --verbose -d "iPhone 15 Pro"
        - name: Generate Allure report
          script: |
              cd allure-xcresult 
              swift run AllureXCResult --input `cd $HOME/VisualStudioProjects/hotel-search/build/*.xcresult && pwd` --output  $HOME/VisualStudioProjects/hotel-search/integration_test/report 
              cd ../
              allure generate --single-file $HOME/VisualStudioProjects/hotel-search/integration_test/report --report-dir $HOME/VisualStudioProjects/hotel-search/integration_test/html_allure_report --clean
        artifacts:
          - integration_test/html_allure_report/*.html
 #--------------------------------- #
 # This workflow needs certificates 
    
    dummy-test-fb-ios-workflow:
        name: Dummy test iOS workflow in Firebase TestLab
        max_build_duration: 120
        instance_type: mac_mini_m2
        environment:
          groups:
            - google_credentials
            - serpapi_credentials
          flutter: 3.29.2
          xcode: 16.2 
          cocoapods: default
          vars:
            GOOGLE_SERVICE_ACCOUNT_JSON: $CM_BUILD_DIR/service-account.json
        cache:
          cache_paths:
            - $HOME/.pub-cache
            - $HOME/Library/Caches/CocoaPods
        scripts:
        - name: Get Flutter packages
          script: | 
              flutter pub get
        - name: Generate .env file
          script: |
            echo "SERPAPI_API_KEY=$SERPAPI_API_KEY" > .env
        - name: Run code generation
          script: dart run build_runner build --delete-conflicting-outputs
        - name: Install pods
          script: | 
              find . -name "Podfile" -execdir pod install \;
        - name: Activate Patrol CLI
          script: | 
              dart pub global activate patrol_cli   
        - name: Activate GCloud CLI
          script: | 
              echo $GOOGLE_SERVICE_ACCOUNT > $GOOGLE_SERVICE_ACCOUNT_JSON
              echo "Service account file generated"
              gcloud auth activate-service-account --key-file=$GOOGLE_SERVICE_ACCOUNT_JSON
              gcloud --quiet config set project $FIREBASE_PROJECT_ID
        - name: Build release w Flutter
          script: |
              flutter build ios --release
        - name: Check folders
          script: |
              pwd
              ls 
              cd build
              ls
              cd ../
        - name: Build test executables
          script: |
              sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
              patrol build ios --target integration_test/dummy_test.dart --release --verbose
        - name: Archive executables
          script: |
              pushd build/ios_integ/Build/Products
              zip -r ios_tests.zip Release-iphoneos *.xctestrun
              popd
        - name: Upload to FB TestLAb and run tests
          script: |
              gcloud firebase test ios run \
                --test build/ios_integ/Build/Products/ios_tests.zip \
                --device model=iphone15,version=18.0,locale=en_US,orientation=portrait